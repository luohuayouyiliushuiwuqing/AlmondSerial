<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番号库抓取</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="pop">
    <header class="head">
      <span class="logo">▶</span>
      <h1>番号库抓取</h1>
    </header>

    <label class="field">
      <span class="field-label">后端地址</span>
      <input id="base" type="text" placeholder="http://127.0.0.1:8000" autocomplete="off" spellcheck="false" />
    </label>

    <button id="captureAll" class="btn primary">抓取全部标签页</button>
    <button id="capture" class="btn secondary">抓取当前页</button>

    <div id="status" class="status" hidden></div>

    <div id="result" class="result" hidden>
      <img id="thumb" alt="" />
      <div class="meta">
        <div id="code" class="code"></div>
        <div id="title" class="title"></div>
      </div>
    </div>

    <ul id="list" class="list" hidden></ul>

    <details id="skipped" class="skipped" hidden>
      <summary id="skippedSummary"></summary>
      <ul id="skippedList"></ul>
    </details>

    <p class="hint">「抓取全部标签页」会遍历浏览器所有窗口的标签页，自动跳过系统页面（chrome://、扩展页等）与本机地址（localhost、127.x、内网 IP），一页识别不出番号也会留档到网页快照。</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
